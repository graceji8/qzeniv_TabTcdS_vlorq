name: Studio

on:
  # schedule:
  #   - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Keep runner alive for SSH debugging'
        type: boolean
        default: false
      skip_pipeline:
        description: 'Skip process_famous_people — UI only'
        type: boolean
        default: false
      gpu_mode:
        description: 'Use NVIDIA GPU (only if self-hosted GPU runner)'
        type: boolean
        default: false
      force_gdrive_restore:
        description: 'Force restore model weights from Google Drive (skip GH cache)'
        type: boolean
        default: false

jobs:
  serve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1.1 Tailscale & Home Proxy ───────────────────────────────────────────
      - name: Upgrade Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          echo "✅ Tailscale version: $(tailscale version)"

      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-routes --ssh

      - name: Setup Home Proxy via SSH
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh -o StrictHostKeyChecking=no -f -N -D 1080 -p 168 admin@100.65.165.65
            echo "SSH SOCKS proxy started on port 1080"
            echo "YTDLP_PROXY=socks5://127.0.0.1:1080" >> $GITHUB_ENV
          else
            echo "WARNING: No SSH_PRIVATE_KEY secret found. Skipping home proxy setup."
          fi

      # ── 2. Python setup ───────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install system deps ────────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            espeak-ng ffmpeg chromium-browser chromium-chromedriver \
            openssh-server nodejs libsndfile1

      # ── 4. Install Python deps ────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          # Google Drive API for model cache backup + output upload
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      # ── 5. Setup Google credentials ───────────────────────────────────────────
      - name: Setup Google Drive Credentials
        run: |
          [ -n "${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}" ] && \
            echo "${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}" > credentials.json
          [ -n "${{ secrets.GOOGLE_DRIVE_TOKEN }}" ] && \
            echo "${{ secrets.GOOGLE_DRIVE_TOKEN }}" | base64 --decode > token.pickle

      # ── 6. Write YouTube cookies ──────────────────────────────────────────────
      - name: Write YouTube cookies
        run: |
          [ -n "${{ secrets.YOUTUBE_COOKIES }}" ] && \
            echo "${{ secrets.YOUTUBE_COOKIES }}" > scripts/cookies.txt || true

      # ── 7. Warm up Chrome ─────────────────────────────────────────────────────
      - name: Warm up Chrome profile
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          chromium-browser --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --user-data-dir="$HOME/.config/chromium" --headless=new \
            https://www.youtube.com &
          sleep 10; kill $! || true

      # ══════════════════════════════════════════════════════════════════════════
      # MODEL WEIGHT CACHING — 3-layer strategy
      #
      #   Layer 1: GitHub Actions cache  — fastest (~1 min), free, 10 GB limit,
      #                                    evicted after 7 days of no use
      #   Layer 2: Google Drive backup   — always available, no size limit,
      #                                    used when GH cache is cold/evicted
      #   Layer 3: HuggingFace download  — last resort, ~2-4 GB, 5-10 min
      #
      # On every run: weights are saved to BOTH GH cache AND Google Drive,
      # so either can restore on the next run.
      # ══════════════════════════════════════════════════════════════════════════

      # ── 8. Layer 1: GitHub Actions cache ─────────────────────────────────────
      - name: Restore model weights (GitHub Actions cache)
        id: gh_cache
        if: ${{ github.event.inputs.force_gdrive_restore != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: omnivoice-hf-${{ runner.os }}-v2
          restore-keys: |
            omnivoice-hf-${{ runner.os }}-

      # ── 9. Layer 2: Google Drive restore (when GH cache misses) ──────────────
      - name: Restore model weights (Google Drive fallback)
        if: steps.gh_cache.outputs.cache-hit != 'true' || github.event.inputs.force_gdrive_restore == 'true'
        run: |
          source venv/bin/activate
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'PYEOF'
          import os, pickle, tarfile, tempfile
          from pathlib import Path
          
          HF_CACHE   = Path.home() / ".cache" / "huggingface"
          GD_FOLDER  = "OmniVoice-ModelCache"
          GD_FILE    = "omnivoice_model_weights.tar.gz"
          
          try:
              from googleapiclient.discovery import build
              from googleapiclient.http import MediaIoBaseDownload
          
              with open('token.pickle', 'rb') as f:
                  creds = pickle.load(f)
              service = build('drive', 'v3', credentials=creds)
          
              results = service.files().list(
                  q=f"name='{GD_FILE}' and trashed=false",
                  fields="files(id, name, size, modifiedTime)",
                  orderBy="modifiedTime desc"
              ).execute()
          
              files = results.get('files', [])
              if not files:
                  print(f"No model backup on Google Drive — will download from HuggingFace")
              else:
                  f = files[0]
                  size_mb = int(f.get('size', 0)) / (1024*1024)
                  print(f"Found backup: {f['name']} ({size_mb:.0f} MB, modified {f['modifiedTime']})")
                  print("Downloading from Google Drive...")
          
                  request = service.files().get_media(fileId=f['id'])
                  tmp = Path(tempfile.gettempdir()) / GD_FILE
                  with open(tmp, 'wb') as fh:
                      dl = MediaIoBaseDownload(fh, request, chunksize=8*1024*1024)
                      done = False
                      while not done:
                          status, done = dl.next_chunk()
                          if status:
                              print(f"  {int(status.progress()*100)}%", end='\r', flush=True)
          
                  print(f"\nExtracting {size_mb:.0f} MB...")
                  HF_CACHE.parent.mkdir(parents=True, exist_ok=True)
                  with tarfile.open(tmp, 'r:gz') as tar:
                      tar.extractall(HF_CACHE.parent)
                  tmp.unlink()
                  print("Model weights restored from Google Drive ✓")
          
          except FileNotFoundError:
              print("No token.pickle — skipping Google Drive restore")
          except Exception as e:
              print(f"Google Drive restore failed (non-fatal): {e}")
          PYEOF

      # ── 10. Build OmniVoice-Studio Docker image ───────────────────────────────
      - name: Build OmniVoice-Studio Docker image
        run: |
          cd OmniVoice-Studio
          docker build -f deploy/Dockerfile -t ghcr.io/debpalash/omnivoice-studio:latest .
          echo "Image built locally"

      # ── 11. Start OmniVoice-Studio container ──────────────────────────────────
      # Mount ~/.cache/huggingface into the container so the model is already
      # there if restored from cache — no re-download needed.
      - name: Start OmniVoice-Studio container
        run: |
          docker volume create omnivoice-data || true

          GPU_FLAGS=""
          [ "${{ github.event.inputs.gpu_mode }}" == "true" ] && GPU_FLAGS="--gpus all"

          docker run -d \
            --name omnivoice \
            $GPU_FLAGS \
            --add-host=host.docker.internal:host-gateway \
            -p 3900:3900 \
            -p 8000:8000 \
            -v omnivoice-data:/app/omnivoice_data \
            -v "$HOME/.cache/huggingface:/root/.cache/huggingface" \
            -e HF_TOKEN="${{ secrets.HF_TOKEN }}" \
            -e PYTHONPATH=/app/backend \
            -e OMNIVOICE_TTS_BACKEND=omnivoice \
            -e YTDLP_PROXY="socks5://host.docker.internal:1080" \
            ghcr.io/debpalash/omnivoice-studio:latest

          echo "Container started — waiting for services..."

          # Wait for UI (port 3900)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3900 > /dev/null && echo "✓ UI ready" && break
            [ $i -eq 60 ] && echo "WARNING: UI timeout" && docker logs omnivoice --tail 30
            sleep 5
          done

          # Wait for API (port 8000)
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/sysinfo > /dev/null && echo "✓ API ready" && break
            [ $i -eq 60 ] && echo "WARNING: API timeout"
            sleep 5
          done

          curl -s http://localhost:8000/sysinfo | python3 -m json.tool || true

      # ── 12. Install cloudflared ───────────────────────────────────────────────
      - name: Install cloudflared
        run: |
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      # ── 13. Start tunnels: UI + API + SSH ────────────────────────────────────
      - name: Start Cloudflare tunnels
        run: |
          # UI tunnel (React app, port 3900)
          cloudflared tunnel --url http://localhost:3900 --logfile tunnel_ui.log &
          sleep 3
          for i in $(seq 1 30); do
            UI_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel_ui.log 2>/dev/null | head -1)
            [ -n "$UI_URL" ] && break; sleep 2
          done

          # API tunnel (FastAPI, port 8000)
          cloudflared tunnel --url http://localhost:8000 --logfile tunnel_api.log &
          sleep 3
          for i in $(seq 1 30); do
            API_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunnel_api.log 2>/dev/null | head -1)
            [ -n "$API_URL" ] && break; sleep 2
          done

          # SSH tunnel
          sudo mkdir -p /var/run/sshd
          echo "runner:runner" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config || true
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config || true
          sudo service ssh start
          cloudflared tunnel --url ssh://localhost:22 --logfile ssh_tunnel.log &
          sleep 3
          for i in $(seq 1 30); do
            SSH_URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' ssh_tunnel.log 2>/dev/null | head -1)
            [ -n "$SSH_URL" ] && break; sleep 2
          done
          SSH_HOST=$(echo "$SSH_URL" | sed 's/https:\/\///')

          TS_IP=$(tailscale ip -4 || echo "Not configured")

          echo "UI_URL=$UI_URL"   >> $GITHUB_ENV
          echo "API_URL=$API_URL" >> $GITHUB_ENV

          echo "============================================================"
          echo ""
          echo "  🎙️  OmniVoice Studio UI  →  $UI_URL"
          echo "  🚀  Tailscale UI         →  http://$TS_IP:3900"
          echo ""
          echo "  🔌  FastAPI:"
          echo "        POST $API_URL/generate"
          echo "        POST $API_URL/dub/upload"
          echo "        POST $API_URL/dub/transcribe/{id}"
          echo "        POST $API_URL/dub/translate"
          echo "        POST $API_URL/dub/generate/{id}"
          echo "        GET  $API_URL/dub/download/{id}"
          echo "        GET  $API_URL/dub/srt/{id}"
          echo "        POST $API_URL/profiles"
          echo "        GET  $API_URL/sysinfo"
          echo ""
          echo "  🖥️  SSH (Cloudflare)     →  ssh -o ProxyCommand=\"cloudflared access ssh --hostname %h\" runner@$SSH_HOST"
          echo "              Password: runner"
          echo "  🖥️  SSH (Tailscale)      →  ssh runner@$TS_IP"
          echo "============================================================"

          # Register in Cloudflare KV
          curl -fsSL -X POST "https://runner-registry.harryji.workers.dev/register" \
            -H "Authorization: Bearer ${{ secrets.RUNNER_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"url\":\"$UI_URL\",
              \"api_url\":\"$API_URL\",
              \"run_id\":\"$GITHUB_RUN_ID\",
              \"started_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
              \"services\":[\"omnivoice-ui\",\"omnivoice-api\",\"ssh\"]
            }"

      # ── 14. Run process_voice_gallery.py ──────────────────────────────────────
      - name: Run process_voice_gallery.py
        if: ${{ github.event.inputs.skip_pipeline != 'true' && github.event.inputs.debug_mode != 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          CLOUDFLARE_ACCOUNTS_JSON: ${{ secrets.CLOUDFLARE_ACCOUNTS_JSON }}
          OMNIVOICE_API_URL: http://localhost:8000
          DISPLAY: ':99'
        run: |
          # Make the secrets available to SSH interactive shells
          cat << EOF >> ~/.bashrc
          export OPENAI_API_KEY="${OPENAI_API_KEY}"
          export HF_TOKEN="${HF_TOKEN}"
          export GH_MODELS_TOKEN="${GH_MODELS_TOKEN}"
          export CLOUDFLARE_ACCOUNTS_JSON='${CLOUDFLARE_ACCOUNTS_JSON}'
          export OMNIVOICE_API_URL="http://localhost:8000"
          export DISPLAY=":99"
          EOF

          source venv/bin/activate
          mkdir -p logs

          [ ! -f /tmp/.X99-lock ] && Xvfb :99 -screen 0 1920x1080x24 & sleep 2

          python scripts/process_voice_gallery.py 2>&1 | tee logs/process_voice_gallery.log

      # ── 15. Keep Server Alive ───────────────────────────────────────────────
      - name: Keep Server Alive
        if: ${{ github.event.inputs.debug_mode == 'true' || github.event.inputs.skip_pipeline == 'true' || success() }}
        run: |
          echo "============================================================"
          echo "  Server is now waiting indefinitely."
          echo "  You can access the OmniVoice UI and SSH into the runner."
          echo "  Sleeping for up to 6 hours..."
          echo "============================================================"
          sleep 21600

      # ── 15b. Keep alive for debugging on failure ─────────────────────────────
      - name: Keep alive for debugging on failure
        if: failure() && github.event.inputs.debug_mode == 'true'
        run: |
          echo "Workflow failed in debug mode. Keeping runner alive for 6 hours..."
          sleep 21600

      # ── 15. Show container logs on failure ───────────────────────────────────
      - name: Show container logs (on failure)
        if: failure()
        run: docker logs omnivoice --tail 100 || true

      # ══════════════════════════════════════════════════════════════════════════
      # POST-RUN: model weight backup + output upload
      # Both run with `if: always()` so they execute even on pipeline failure.
      # ══════════════════════════════════════════════════════════════════════════

      # ── 16. Backup model weights → Google Drive ───────────────────────────────
      # Smart backup: skips upload if existing backup is <7 days old AND same size
      - name: Backup model weights to Google Drive
        if: always()
        run: |
          source venv/bin/activate
          python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'PYEOF'
          import os, pickle, tarfile, tempfile
          from pathlib import Path
          from datetime import datetime, timezone
          
          HF_CACHE  = Path.home() / ".cache" / "huggingface"
          GD_FOLDER = "OmniVoice-ModelCache"
          GD_FILE   = "omnivoice_model_weights.tar.gz"
          
          if not HF_CACHE.exists() or not any(HF_CACHE.rglob("*")):
              print("No HuggingFace cache — model not downloaded this run, nothing to back up")
              exit(0)
          
          total_bytes = sum(f.stat().st_size for f in HF_CACHE.rglob("*") if f.is_file())
          total_mb = total_bytes / (1024*1024)
          print(f"HF cache: {total_mb:.0f} MB")
          
          if total_mb < 50:
              print("Cache too small — model likely not fully downloaded, skipping backup")
              exit(0)
          
          try:
              from googleapiclient.discovery import build
              from googleapiclient.http import MediaFileUpload
          
              with open('token.pickle', 'rb') as f:
                  creds = pickle.load(f)
              service = build('drive', 'v3', credentials=creds)
          
              # Get or create folder
              q = f"name='{GD_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false"
              res = service.files().list(q=q, fields="files(id)").execute()
              if res['files']:
                  folder_id = res['files'][0]['id']
              else:
                  folder_id = service.files().create(
                      body={'name': GD_FOLDER, 'mimeType': 'application/vnd.google-apps.folder'}
                  ).execute()['id']
                  print(f"Created Google Drive folder: {GD_FOLDER}")
          
              # Check existing backup freshness
              existing = service.files().list(
                  q=f"name='{GD_FILE}' and '{folder_id}' in parents and trashed=false",
                  fields="files(id, modifiedTime, size)",
                  orderBy="modifiedTime desc"
              ).execute().get('files', [])
          
              if existing:
                  mod_time = datetime.fromisoformat(existing[0]['modifiedTime'].replace('Z', '+00:00'))
                  age_days = (datetime.now(timezone.utc) - mod_time).days
                  existing_mb = int(existing[0].get('size', 0)) / (1024*1024)
                  print(f"Existing backup: {existing_mb:.0f} MB compressed, {age_days} days old")
                  size_diff_pct = abs(existing_mb * 3 - total_mb) / max(total_mb, 1)  # rough 3x compression
                  if age_days < 7 and size_diff_pct < 0.15:
                      print("Backup is fresh and same approximate size — skipping re-upload ✓")
                      exit(0)
                  print(f"Backup stale or changed — re-uploading")
          
              # Compress
              tmp = Path(tempfile.gettempdir()) / GD_FILE
              print(f"Compressing {total_mb:.0f} MB (level 6)...")
              with tarfile.open(tmp, 'w:gz', compresslevel=6) as tar:
                  tar.add(HF_CACHE, arcname="huggingface")
              compressed_mb = tmp.stat().st_size / (1024*1024)
              print(f"Compressed → {compressed_mb:.0f} MB — uploading to Google Drive...")
          
              # Delete old backup
              for old in existing:
                  service.files().delete(fileId=old['id']).execute()
          
              # Resumable upload (important for large files)
              media = MediaFileUpload(str(tmp), mimetype='application/gzip',
                                      chunksize=8*1024*1024, resumable=True)
              req = service.files().create(
                  body={'name': GD_FILE, 'parents': [folder_id]},
                  media_body=media, fields='id'
              )
              response = None
              while response is None:
                  status, response = req.next_chunk()
                  if status:
                      print(f"  {int(status.progress()*100)}%", end='\r', flush=True)
          
              tmp.unlink()
              print(f"\nModel weights backed up to Google Drive ✓  ({compressed_mb:.0f} MB compressed)")
          
          except FileNotFoundError:
              print("No token.pickle — skipping")
          except Exception as e:
              print(f"Backup failed (non-fatal): {e}")
          PYEOF

      # ── 17. Upload generated outputs → Google Drive ───────────────────────────
      # Folder structure: OmniVoice-Outputs / YYYY-MM-DD_HHMM_runID / ...
      - name: Upload OmniVoice outputs to Google Drive
        if: always()
        run: |
          mkdir -p omnivoice_outputs/dub_jobs
          docker cp omnivoice:/app/omnivoice_data/outputs/. omnivoice_outputs/ 2>/dev/null || true
          docker cp omnivoice:/app/omnivoice_data/dub_jobs/. omnivoice_outputs/dub_jobs/ 2>/dev/null || true

          if [ ! "$(ls -A omnivoice_outputs 2>/dev/null)" ]; then
            echo "No outputs to upload"; exit 0
          fi

          source venv/bin/activate
          GITHUB_RUN_ID="${{ github.run_id }}" python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'PYEOF'
          import os, glob, pickle
          from pathlib import Path
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from datetime import datetime, timezone
          
          try:
              with open('token.pickle', 'rb') as f:
                  creds = pickle.load(f)
              service = build('drive', 'v3', credentials=creds)
          
              run_id   = os.environ.get('GITHUB_RUN_ID', 'unknown')
              date_str = datetime.now(timezone.utc).strftime('%Y-%m-%d_%H%M')
              session  = f"{date_str}_{run_id}"
          
              def get_or_create(name, parent=None):
                  q = f"name='{name}' and mimeType='application/vnd.google-apps.folder' and trashed=false"
                  if parent:
                      q += f" and '{parent}' in parents"
                  r = service.files().list(q=q, fields="files(id)").execute()
                  if r['files']:
                      return r['files'][0]['id']
                  body = {'name': name, 'mimeType': 'application/vnd.google-apps.folder'}
                  if parent:
                      body['parents'] = [parent]
                  return service.files().create(body=body).execute()['id']
          
              root_id    = get_or_create('OmniVoice-Outputs')
              session_id = get_or_create(session, root_id)
          
              ALLOWED = {'.wav','audio/wav'}, {'.mp4','video/mp4'}, \
                        {'.srt','text/plain'}, {'.vtt','text/vtt'}, \
                        {'.json','application/json'}, {'.log','text/plain'}
              MIME = {'.wav':'audio/wav','.mp4':'video/mp4','.srt':'text/plain',
                      '.vtt':'text/vtt','.json':'application/json','.log':'text/plain',
                      '.db':'application/octet-stream'}
              ALLOWED_EXT = set(MIME.keys())
          
              uploaded = 0
              for fpath in sorted(glob.glob('omnivoice_outputs/**/*', recursive=True)):
                  if not os.path.isfile(fpath):
                      continue
                  ext = Path(fpath).suffix.lower()
                  if ext not in ALLOWED_EXT:
                      continue
                  size_mb = os.path.getsize(fpath) / (1024*1024)
                  if size_mb > 500:
                      print(f"  SKIP (too large): {fpath} ({size_mb:.0f} MB)")
                      continue
          
                  rel   = os.path.relpath(fpath, 'omnivoice_outputs')
                  parts = Path(rel).parts
                  parent = session_id
                  for part in parts[:-1]:
                      parent = get_or_create(part, parent)
          
                  media = MediaFileUpload(fpath, mimetype=MIME.get(ext, 'application/octet-stream'),
                                          resumable=size_mb > 5)
                  service.files().create(
                      body={'name': parts[-1], 'parents': [parent]},
                      media_body=media
                  ).execute()
                  print(f"  ✓ {rel}  ({size_mb:.1f} MB)")
                  uploaded += 1
          
              print(f"\nUploaded {uploaded} files → Google Drive/OmniVoice-Outputs/{session}")
          
          except FileNotFoundError:
              print("No token.pickle — skipping")
          except Exception as e:
              print(f"Output upload failed (non-fatal): {e}")
          PYEOF

      # ── 18. Cleanup & deregister ──────────────────────────────────────────────
      - name: Cleanup
        if: always()
        run: |
          docker stop omnivoice || true
          docker rm   omnivoice || true
          curl -fsSL -X DELETE "https://runner-registry.harryji.workers.dev/register" \
            -H "Authorization: Bearer ${{ secrets.RUNNER_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"run_id\":\"$GITHUB_RUN_ID\"}"
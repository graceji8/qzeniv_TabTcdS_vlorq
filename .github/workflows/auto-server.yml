name: auto server

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  serve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python setup with pip cache ───────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install dependencies ───────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      # ── 4. Install system dependencies ───────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak ffmpeg chromium-browser chromium-chromedriver

      # ── 5. Setup Google Drive Credentials ────────────────────────────────────
      - name: Setup Google Drive Credentials
        run: |
          if [ -n "${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}" ]; then
            echo "${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}" > credentials.json
          fi
          if [ -n "${{ secrets.GOOGLE_DRIVE_TOKEN }}" ]; then
            echo "${{ secrets.GOOGLE_DRIVE_TOKEN }}" | base64 --decode > token.pickle
          fi

      # ── 5b. Write YouTube cookies from secret ────────────────────────────────
      - name: Write YouTube cookies
        run: |
          if [ -n "${{ secrets.YOUTUBE_COOKIES }}" ]; then
            echo "${{ secrets.YOUTUBE_COOKIES }}" > scripts/cookies.txt
            echo "cookies.txt written ($(wc -l < scripts/cookies.txt) lines)"
          else
            echo "No YOUTUBE_COOKIES secret found — YouTube will be skipped, SoundCloud only"
          fi

      # ── 7. Run Famous People Processing ──────────────────────────────────────
      - name: Run process_famous_people.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # needed for AI list generation
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DISPLAY: ':99'
        run: |
          source venv/bin/activate
          mkdir -p logs

          # Start Xvfb only if not already running
          if [ ! -f /tmp/.X99-lock ]; then
            Xvfb :99 -screen 0 1920x1080x24 &
            sleep 2
          fi

          python scripts/process_famous_people.py 2>&1 | tee logs/process_famous.log